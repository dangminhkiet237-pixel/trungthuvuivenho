<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trung Thu cùng _lkimlam</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: linear-gradient(180deg, #2a2540 0%, #443a5e 55%, #6b5a78 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Comic Sans MS', 'Segoe UI', sans-serif;
    position: relative;
    overflow: hidden;
  }

  .moon {
    position: absolute;
    top: 8%;
    right: 12%;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff6d8, #ffe89a 60%, #ffd76b 100%);
    box-shadow: 0 0 60px 20px rgba(255, 230, 150, 0.35);
  }

  .lantern {
    position: absolute;
    bottom: -60px;
    width: 34px;
    height: 44px;
    background: linear-gradient(180deg, #ff8a4c, #ff5f3d);
    border-radius: 40% 40% 45% 45% / 55% 55% 45% 45%;
    box-shadow: 0 0 14px rgba(255, 140, 70, 0.6);
    animation: rise linear infinite, sway ease-in-out infinite;
    transform-origin: top center;
  }
  .lantern::before,
  .lantern::after {
    content: '';
    position: absolute;
    left: 50%;
    width: 4px;
    background: #7a4a2c;
    transform: translateX(-50%);
  }
  .lantern::before { top: -14px; height: 14px; }
  .lantern::after { bottom: -10px; height: 10px; }

  .lantern-1 { left: 8%;  animation-duration: 9s, 3s;  animation-delay: 0s, 0s; }
  .lantern-2 { left: 22%; scale: 0.7; animation-duration: 11s, 2.6s; animation-delay: 2s, 0.4s; }
  .lantern-3 { left: 78%; scale: 0.6; animation-duration: 8s, 3.4s;  animation-delay: 4s, 0.8s; }
  .lantern-4 { left: 40%; scale: 0.8; animation-duration: 10s, 3s;  animation-delay: 1s, 1.2s; }
  .lantern-5 { left: 62%; scale: 0.75; animation-duration: 12s, 2.8s; animation-delay: 3s, 1.6s; }

  @keyframes rise {
    0% { bottom: -60px; opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { bottom: 110%; opacity: 0; }
  }

  @keyframes sway {
    0%, 100% { margin-left: -10px; }
    50% { margin-left: 10px; }
  }

  .star {
    position: absolute;
    color: #ffe89a;
    font-size: 14px;
    opacity: 0.85;
    animation: twinkle 2s ease-in-out infinite;
  }
  .star-1 { top: 20%; left: 40%; animation-delay: 0s; }
  .star-2 { top: 35%; right: 20%; font-size: 10px; animation-delay: 0.5s; }
  .star-3 { bottom: 30%; left: 25%; font-size: 12px; animation-delay: 1s; }
  .star-4 { top: 10%; left: 60%; font-size: 10px; animation-delay: 1.5s; }

  @keyframes twinkle {
    0%, 100% { opacity: 0.3; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.2); }
  }

  .moon {
    animation: glow 4s ease-in-out infinite;
  }

  @keyframes glow {
    0%, 100% { box-shadow: 0 0 60px 20px rgba(255, 230, 150, 0.35); }
    50% { box-shadow: 0 0 80px 30px rgba(255, 230, 150, 0.55); }
  }

  .card {
    background: #fdf3f5;
    width: 100%;
    max-width: 480px;
    padding: 60px 32px;
    text-align: center;
    border-radius: 2px;
    position: relative;
    z-index: 2;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }

  .card h1 {
    color: #f28ba0;
    font-size: 2.1rem;
    font-weight: 600;
    line-height: 1.3;
    margin-bottom: 40px;
  }

  .buttons {
    display: flex;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
    position: relative;
    min-height: 70px;
  }

  button {
    border: none;
    background: #f6b9c6;
    color: #ffffff;
    font-family: inherit;
    font-size: 1.2rem;
    font-weight: 600;
    padding: 14px 32px;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease, top 0.25s ease, left 0.25s ease;
  }

  #noBtn.dodging {
    position: fixed;
    z-index: 50;
  }

  button:hover {
    background: #f2a5b6;
    transform: translateY(-2px);
  }

  button:active {
    transform: translateY(0);
  }

  .video-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    align-items: center;
    justify-content: center;
    z-index: 100;
  }

  .video-overlay.show {
    display: flex;
  }

  .video-overlay video {
    max-width: 90%;
    max-height: 80%;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }

  .video-overlay .close-video {
    position: absolute;
    top: 24px;
    right: 28px;
    background: transparent;
    border: none;
    color: #fff;
    font-size: 2rem;
    cursor: pointer;
    padding: 4px 12px;
  }
</style>
</head>
<body>
  <div class="moon"></div>
  <div class="lantern lantern-1"></div>
  <div class="lantern lantern-2"></div>
  <div class="lantern lantern-3"></div>
  <div class="lantern lantern-4"></div>
  <div class="lantern lantern-5"></div>
  <span class="star star-1">✦</span>
  <span class="star star-2">✦</span>
  <span class="star star-3">✦</span>
  <span class="star star-4">✦</span>

  <div class="card">
    <h1>Bạn có muốn nhận quà trung thu từ _lkimlam không?</h1>
    <div class="buttons">
      <button id="yesBtn" onclick="playGift()">🏮 Có</button>
      <button id="noBtn" onclick="handleNo()">🥮 Không</button>
    </div>
  </div>

  <div class="video-overlay" id="videoOverlay">
    <button class="close-video" onclick="closeVideo()">×</button>
    <video id="giftVideo" controls playsinline>
      <source src="video.mp4" type="video/mp4">
      Trình duyệt của bạn không hỗ trợ video.
    </video>
  </div>

  <script>
    let noCount = 0;
    const noBtn = document.getElementById('noBtn');

    function handleNo() {
      noCount++;
      if (noCount < 4) {
        dodge();
      } else {
        playGift();
      }
    }

    function dodge() {
      const rect = noBtn.getBoundingClientRect();
      const btnW = rect.width;
      const btnH = rect.height;
      const margin = 16;

      const maxLeft = window.innerWidth - btnW - margin;
      const maxTop = window.innerHeight - btnH - margin;

      const randomLeft = Math.random() * (maxLeft - margin) + margin;
      const randomTop = Math.random() * (maxTop - margin) + margin;

      noBtn.classList.add('dodging');
      noBtn.style.left = randomLeft + 'px';
      noBtn.style.top = randomTop + 'px';
    }

    function playGift() {
      const overlay = document.getElementById('videoOverlay');
      const video = document.getElementById('giftVideo');
      overlay.classList.add('show');
      video.currentTime = 0;
      video.play();
    }

    function closeVideo() {
      const overlay = document.getElementById('videoOverlay');
      const video = document.getElementById('giftVideo');
      video.pause();
      overlay.classList.remove('show');
    }

    window.addEventListener('resize', () => {
      if (noBtn.classList.contains('dodging')) {
        dodge();
      }
    });
  </script>
</body>
</html>
