<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản trị - Trung Thu cùng _lkimlam</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: linear-gradient(180deg, #2a2540 0%, #443a5e 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', sans-serif;
    padding: 24px;
  }

  .panel {
    background: #fdf3f5;
    width: 100%;
    max-width: 480px;
    padding: 40px 32px;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }

  h1 {
    color: #f28ba0;
    font-size: 1.5rem;
    margin-bottom: 24px;
    text-align: center;
  }

  label {
    display: block;
    font-size: 0.9rem;
    color: #7a5a63;
    margin-bottom: 6px;
    margin-top: 18px;
    font-weight: 600;
  }

  input[type="password"],
  input[type="text"],
  textarea {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #f0c9d2;
    border-radius: 10px;
    font-size: 1rem;
    font-family: inherit;
    background: #fff;
  }

  textarea {
    resize: vertical;
    min-height: 70px;
  }

  button {
    margin-top: 24px;
    width: 100%;
    border: none;
    background: #f6b9c6;
    color: #fff;
    font-size: 1.05rem;
    font-weight: 600;
    padding: 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  button:hover { background: #f2a5b6; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }

  .status {
    margin-top: 16px;
    text-align: center;
    font-size: 0.9rem;
    min-height: 20px;
  }

  .status.ok { color: #2e8b57; }
  .status.error { color: #d1435b; }

  .hidden { display: none; }

  .file-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .file-row input[type="file"] { flex: 1; font-size: 0.85rem; }

  .current-preview {
    margin-top: 8px;
    font-size: 0.8rem;
    color: #9b7b83;
    word-break: break-all;
  }

  video#previewVideo {
    width: 100%;
    margin-top: 10px;
    border-radius: 8px;
    max-height: 220px;
  }

  .divider {
    border: none;
    border-top: 1px dashed #f0c9d2;
    margin: 28px 0 16px;
  }

  .switch-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 8px;
  }

  .switch-row span {
    font-weight: 600;
    color: #7a5a63;
  }

  .switch {
    position: relative;
    display: inline-block;
    width: 50px;
    height: 28px;
  }

  .switch input { opacity: 0; width: 0; height: 0; }

  .slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background-color: #e6c3cb;
    border-radius: 999px;
    transition: 0.2s;
  }

  .slider::before {
    content: '';
    position: absolute;
    height: 22px;
    width: 22px;
    left: 3px;
    bottom: 3px;
    background-color: #fff;
    border-radius: 50%;
    transition: 0.2s;
  }

  input:checked + .slider {
    background-color: #f28ba0;
  }

  input:checked + .slider::before {
    transform: translateX(22px);
  }

  .minutes-row {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }

  .minutes-row input {
    flex: 1;
  }

  .quick-btns {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }

  .quick-btns button {
    flex: 1;
    margin-top: 0;
    background: #fff;
    border: 1px solid #f0c9d2;
    color: #f28ba0;
    padding: 8px;
    font-size: 0.85rem;
  }

  .quick-btns button:hover {
    background: #fdf3f5;
  }
</style>
</head>
<body>
  <div class="panel">
    <h1>🔒 Trang quản trị</h1>

    <div id="loginBox">
      <label for="passwordInput">Mật khẩu</label>
      <input type="password" id="passwordInput" placeholder="Nhập mật khẩu" />
      <button onclick="tryLogin()">Đăng nhập</button>
      <div class="status error" id="loginStatus"></div>
    </div>

    <div id="editBox" class="hidden">
      <label for="titleInput">Tiêu đề hiển thị</label>
      <textarea id="titleInput" placeholder="Nhập tiêu đề mới..."></textarea>

      <label for="videoUrlInput">Link video (URL)</label>
      <input type="text" id="videoUrlInput" placeholder="https://..." />
      <div class="current-preview" id="currentVideoLabel"></div>

      <label>Hoặc tải lên video mới (mp4)</label>
      <div class="file-row">
        <input type="file" id="videoFileInput" accept="video/mp4" />
      </div>
      <video id="previewVideo" controls class="hidden"></video>

      <button onclick="saveContent()" id="saveBtn">💾 Lưu & Đồng bộ ngay</button>
      <div class="status" id="saveStatus"></div>

      <hr class="divider">

      <div class="switch-row">
        <span>🛠️ Chế độ bảo trì</span>
        <label class="switch">
          <input type="checkbox" id="maintenanceToggle" />
          <span class="slider"></span>
        </label>
      </div>

      <label for="maintenanceMinutes">Tự động tắt sau (phút)</label>
      <div class="minutes-row">
        <input type="number" id="maintenanceMinutes" placeholder="VD: 30" min="1" />
      </div>
      <div class="quick-btns">
        <button type="button" onclick="setQuickMinutes(15)">15 phút</button>
        <button type="button" onclick="setQuickMinutes(30)">30 phút</button>
        <button type="button" onclick="setQuickMinutes(60)">1 giờ</button>
      </div>
      <div class="current-preview" id="maintenanceStatusLabel"></div>

      <button onclick="saveMaintenance()" id="maintenanceBtn">🔧 Lưu trạng thái bảo trì</button>
      <div class="status" id="maintenanceStatus"></div>
    </div>
  </div>

  <script>
    const ADMIN_PASSWORD_CHECK_ENDPOINT = '/api/content';
    let password = '';

    function tryLogin() {
      const input = document.getElementById('passwordInput').value;
      const statusEl = document.getElementById('loginStatus');

      if (input === '160511') {
        password = input;
        document.getElementById('loginBox').classList.add('hidden');
        document.getElementById('editBox').classList.remove('hidden');
        statusEl.textContent = '';
        loadCurrentContent();
      } else {
        statusEl.textContent = 'Sai mật khẩu, thử lại.';
      }
    }

    async function loadCurrentContent() {
      try {
        const res = await fetch('/api/content', { cache: 'no-store' });
        const data = await res.json();
        document.getElementById('titleInput').value = data.title || '';
        document.getElementById('videoUrlInput').value = data.videoUrl || '';
        document.getElementById('currentVideoLabel').textContent = 'Video hiện tại: ' + (data.videoUrl || '(chưa có)');

        const maintenance = data.maintenance || { enabled: false, endTime: null };
        document.getElementById('maintenanceToggle').checked = !!maintenance.enabled;
        updateMaintenanceLabel(maintenance);
      } catch (err) {
        document.getElementById('saveStatus').textContent = 'Không tải được nội dung hiện tại.';
        document.getElementById('saveStatus').className = 'status error';
      }
    }

    function updateMaintenanceLabel(maintenance) {
      const label = document.getElementById('maintenanceStatusLabel');
      if (!maintenance || !maintenance.enabled) {
        label.textContent = 'Hiện tại: đang TẮT bảo trì.';
        return;
      }
      if (maintenance.endTime) {
        const end = new Date(maintenance.endTime);
        label.textContent = 'Hiện tại: đang BẬT bảo trì, tự tắt lúc ' + end.toLocaleString('vi-VN');
      } else {
        label.textContent = 'Hiện tại: đang BẬT bảo trì (không giới hạn thời gian).';
      }
    }

    function setQuickMinutes(mins) {
      document.getElementById('maintenanceMinutes').value = mins;
      document.getElementById('maintenanceToggle').checked = true;
    }

    async function saveMaintenance() {
      const btn = document.getElementById('maintenanceBtn');
      const statusEl = document.getElementById('maintenanceStatus');
      btn.disabled = true;
      statusEl.textContent = 'Đang lưu...';
      statusEl.className = 'status';

      try {
        const enabled = document.getElementById('maintenanceToggle').checked;
        const minutes = parseInt(document.getElementById('maintenanceMinutes').value, 10);

        let endTime = null;
        if (enabled && minutes > 0) {
          endTime = new Date(Date.now() + minutes * 60000).toISOString();
        }

        const res = await fetch('/api/content', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            password,
            maintenance: { enabled, endTime },
          }),
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.error || 'Lưu thất bại');
        }

        const data = await res.json();
        updateMaintenanceLabel(data.content.maintenance);
        statusEl.textContent = '✅ Đã cập nhật trạng thái bảo trì!';
        statusEl.className = 'status ok';
      } catch (err) {
        statusEl.textContent = '❌ ' + err.message;
        statusEl.className = 'status error';
      } finally {
        btn.disabled = false;
      }
    }

    // Xem trước video khi chọn file
    document.getElementById('videoFileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      const preview = document.getElementById('previewVideo');
      if (file) {
        preview.src = URL.createObjectURL(file);
        preview.classList.remove('hidden');
      }
    });

    async function uploadVideoIfNeeded() {
      const fileInput = document.getElementById('videoFileInput');
      const file = fileInput.files[0];
      if (!file) return null;

      const statusEl = document.getElementById('saveStatus');
      statusEl.textContent = 'Đang tải video lên...';
      statusEl.className = 'status';

      const res = await fetch('/api/upload', {
        method: 'POST',
        headers: {
          'x-admin-password': password,
          'x-filename': file.name,
          'Content-Type': file.type || 'video/mp4',
        },
        body: file,
      });

      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(errData.error || 'Upload video thất bại');
      }

      const data = await res.json();
      return data.url;
    }

    async function saveContent() {
      const saveBtn = document.getElementById('saveBtn');
      const statusEl = document.getElementById('saveStatus');
      saveBtn.disabled = true;
      statusEl.textContent = 'Đang lưu...';
      statusEl.className = 'status';

      try {
        let videoUrl = document.getElementById('videoUrlInput').value.trim();

        const uploadedUrl = await uploadVideoIfNeeded();
        if (uploadedUrl) {
          videoUrl = uploadedUrl;
          document.getElementById('videoUrlInput').value = uploadedUrl;
        }

        const title = document.getElementById('titleInput').value.trim();

        const res = await fetch('/api/content', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password, title, videoUrl }),
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.error || 'Lưu thất bại');
        }

        statusEl.textContent = '✅ Đã lưu! Trang chính sẽ cập nhật ngay khi tải lại.';
        statusEl.className = 'status ok';
        document.getElementById('currentVideoLabel').textContent = 'Video hiện tại: ' + videoUrl;
      } catch (err) {
        statusEl.textContent = '❌ ' + err.message;
        statusEl.className = 'status error';
      } finally {
        saveBtn.disabled = false;
      }
    }

    document.getElementById('passwordInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') tryLogin();
    });
  </script>
</body>
</html>
